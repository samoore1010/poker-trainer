<title>Hand Walkthrough Table</title>

<style>

  :root {

      --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
      --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;

  }
  :root[data-theme="dark"] {
    --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
    --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;

<script>
(function () {
  'use strict';
  const RANKS = '23456789TJQKA', SYM = ['♣', '♦', '♥', '♠'];
  const RN = ['two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'jack', 'queen', 'king', 'ace'];
  const RP = ['twos', 'threes', 'fours', 'fives', 'sixes', 'sevens', 'eights', 'nines', 'tens', 'jacks', 'queens', 'kings', 'aces'];

      else { const isB = h.bettor[step] === i; act.className = 'act' + (isB ? ' bet' : ''); act.textContent = isB ? `Bets ${money(h.bet[step])}` : `Calls ${money(h.bet[step])}`; }
      s.appendChild(act);
      tb.appendChild(s);
    });
    // progression
    $('steps').innerHTML = STEP.map((s, i) => `<button data-step="${i}" class="${i === step ? 'on' : i < step ? 'done' : ''}"><i></i>${s}</button>` + (i < 4 ? `<span class="seg ${i < step ? 'done' : ''}"></span>` : '')).join('');
    $('nextBtn').textContent = NEXT[step]; $('backBtn').disabled = step === 0;
    $('hint').textContent = step === 4 ? 'Hand over.' : nb < 5 ? `${5 - nb} card${nb === 4 ? '' : 's'} to come` : 'All cards out';
  }

  // ----- card picker -----
  let pick = [null, null, null, null, null, null, null]; // you ×2, flop ×3, turn, river
  const SLOT_GROUPS = [['You', [0, 1]], ['Flop', [2, 3, 4]], ['Turn', [5]], ['River', [6]]];
  function pickStatus() {
    const f = pick.slice(2, 5).filter(x => x !== null).length, t = pick[5] !== null, r = pick[6] !== null;
    if (pick[0] === null || pick[1] === null) return [false, 'Pick your two cards.'];
    if (f > 0 && f < 3) return [false, 'Pick all three flop cards, or clear them.'];
    if (t && f < 3) return [false, 'A turn card needs a flop.'];
    if (r && !t) return [false, 'A river card needs a turn.'];
    return [true, f === 0 ? 'Ready. The board will be random.' : `Ready with a set ${r ? 'flop, turn and river' : t ? 'flop and turn' : 'flop'}.`];
  }
  function renderPicker() {
    const sl = $('slots'); sl.innerHTML = '';
    const nextI = pick.findIndex(x => x === null);
    SLOT_GROUPS.forEach(([lbl, idx], gi) => {
      if (gi) { const gp = document.createElement('span'); gp.className = 'gap'; sl.appendChild(gp); }
      const l = document.createElement('span'); l.className = 'lbl'; l.textContent = lbl; sl.appendChild(l);
      idx.forEach(i => { const d = document.createElement('div'); d.className = 'slot-s' + (pick[i] !== null ? ' filled' : '') + (i === nextI ? ' next' : ''); d.dataset.slot = i; d.title = lbl; if (pick[i] !== null) d.appendChild(cardEl(pick[i], 'sm')); sl.appendChild(d); });
    });
    const dk = $('deck'); dk.innerHTML = '';
    for (let su = 3; su >= 0; su--) for (let r = 12; r >= 0; r--) { const c = r * 4 + su; const b = document.createElement('button'); b.type = 'button'; b.className = (isRed(c) ? 'red' : '') + (pick.includes(c) ? ' sel' : ''); b.dataset.card = c; b.textContent = RANKS[r] + SYM[su]; dk.appendChild(b); }
    const [ok, msg] = pickStatus(); $('pkDeal').disabled = !ok; $('pkNote').textContent = msg;
  }
  // Natural-language deal parser: "ace of spades, jack of hearts, flop king of hearts ten of hearts two of hearts, turn eight of spades, river three of diamonds" (shorthand like "As Jh" works too).
  const RW = { ace: 12, aces: 12, a: 12, king: 11, kings: 11, k: 11, queen: 10, queens: 10, q: 10, jack: 9, jacks: 9, j: 9, ten: 8, tens: 8, t: 8, '10': 8, nine: 7, nines: 7, '9': 7, eight: 6, eights: 6, '8': 6, seven: 5, sevens: 5, '7': 5, six: 4, sixes: 4, '6': 4, five: 3, fives: 3, '5': 3, four: 2, fours: 2, '4': 2, three: 1, threes: 1, trey: 1, '3': 1, two: 0, twos: 0, deuce: 0, '2': 0 };
  const SW = { club: 0, clubs: 0, c: 0, diamond: 1, diamonds: 1, d: 1, heart: 2, hearts: 2, h: 2, spade: 3, spades: 3, s: 3 };
  const SECT = { deal: 0, me: 0, hand: 0, hole: 0, you: 0, your: 0, my: 0, flop: 1, turn: 2, river: 3, board: 1 };
  function parseDeal(text) {
    const toks = text.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    const groups = [[], [], [], []]; let g = 0, errs = [];
    const push = c => { if (groups.flat().includes(c)) { errs.push(RANKS[rankOf(c)] + SYM[suitOf(c)] + ' twice'); return; } groups[g].push(c); };
    for (let i = 0; i < toks.length; i++) {
      const w = toks[i];
      if (w in SECT) { g = SECT[w]; continue; }
      if (w === 'of' || w === 'the' || w === 'and' || w === 'is' || w === 'a' && !(toks[i + 1] in SW) ) continue;
      let r = null, sIdx = null;
      const m = w.match(/^(10|[2-9]|[akqjt])([cdhs])$/); // shorthand As, 10h, Kd
      if (m) { r = RW[m[1]]; push(r * 4 + SW[m[2]]); continue; }
      if (w in RW) { r = RW[w]; let j = i + 1; if (toks[j] === 'of') j++; if (toks[j] in SW) { push(r * 4 + SW[toks[j]]); i = j; } else errs.push(`${w}: no suit`); continue; }
    }
    return { groups, errs };
  }
  function applyParsed(text) {
    const { groups, errs } = parseDeal(text);
    const all = groups.flat();
    const np = [null, null, null, null, null, null, null];
    if (groups[0].length + groups[1].length + groups[2].length + groups[3].length && !groups[1].length && !groups[2].length && !groups[3].length) {
      // no section words: fill in order 2 / 3 / 1 / 1
      all.slice(0, 7).forEach((c, i) => np[i] = c);
    } else {
      groups[0].slice(0, 2).forEach((c, i) => np[i] = c);
      groups[1].slice(0, 3).forEach((c, i) => np[2 + i] = c);
      if (groups[2][0] !== undefined) np[5] = groups[2][0];
      if (groups[3][0] !== undefined) np[6] = groups[3][0];
    }
    if (!all.length) { sayNote('No cards recognized. Try "ace of spades, jack of hearts" or "As Jh".', true); return; }
    pick = np; renderPicker();
    sayNote(errs.length ? 'Set what I could. Skipped: ' + errs.join(', ') : `Set ${all.length} card${all.length > 1 ? 's' : ''}. Check the slots, then deal.`, errs.length > 0);
  }
  function sayNote(t, err) { const n = $('sayNote'); n.textContent = t; n.classList.toggle('err', !!err); }
  $('sayBtn').addEventListener('click', () => applyParsed($('sayIn').value));
  $('sayIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyParsed($('sayIn').value); } });
  // Microphone: browser speech recognition where the host allows it; otherwise OS dictation into the text box still works.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
  if (!SR) $('micBtn').hidden = true;
  $('micBtn').addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
      rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript + ' '; $('sayIn').value = t.trim(); if (e.results[e.results.length - 1].isFinal) applyParsed(t); };
      rec.onerror = e => { sayNote(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'The microphone is blocked in this viewer. Use your system dictation key to speak into the text box, or open the file directly in Chrome.' : 'Microphone error: ' + e.error, true); };
      rec.onend = () => { rec = null; $('micBtn').classList.remove('live'); };
      rec.start(); $('micBtn').classList.add('live'); sayNote('Listening…');
    } catch (err) { rec = null; sayNote('Microphone not available here. Use system dictation into the text box.', true); }
  });
  $('deck').addEventListener('click', e => { const b = e.target.closest('[data-card]'); if (!b) return; const c = +b.dataset.card; const at = pick.indexOf(c); if (at >= 0) { pick[at] = null; } else { const i = pick.indexOf(null); if (i < 0) return; pick[i] = c; } renderPicker(); });
  $('slots').addEventListener('click', e => { const s = e.target.closest('[data-slot]'); if (!s) return; pick[+s.dataset.slot] = null; renderPicker(); });
  $('pkClear').addEventListener('click', () => { pick = [null, null, null, null, null, null, null]; $('sayIn').value = ''; renderPicker(); sayNote('Click cards to fill the slots, or describe the deal above.'); });
  function setPicker(open) { $('picker').hidden = !open; $('pickBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) renderPicker(); }
  $('pkDeal').addEventListener('click', () => { const [ok] = pickStatus(); if (!ok) return; const bd = pick.slice(2).filter(x => x !== null); setPicker(false); deal([pick[0], pick[1]], bd); });
  $('pickBtn').addEventListener('click', () => setPicker($('picker').hidden));
  $('pkClose').addEventListener('click', () => setPicker(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('picker').hidden) setPicker(false); });
  document.addEventListener('pointerdown', e => { if (!$('picker').hidden && !e.target.closest('#picker') && !e.target.closest('#pickBtn')) setPicker(false); });

  // ----- advisor -----
  function improvementRows(S, nb) {
    const h = hand; const nc = nb > 0 ? nextCardGroups(h.hero, board()) : null;
    const col1 = nb === 0 ? 'By flop' : 'Next card';
    let rows = S.list.map(g => {
      const river = g.river / S.trials * 100, winIf = g.river ? g.win / g.river * 100 : null;
      const first = nb === 0 ? g.flop / S.trials * 100 : (nc.groups.get(g.key) || []).length / nc.avail * 100;
      const cards = nb > 0 ? (nc.groups.get(g.key) || []) : [];
      return { label: g.label, cards, first, river, winIf };
    });
    if (nb > 0) nc.groups.forEach((cards, key) => { if (!rows.some(r => r.cards === cards)) { const d = pathOf(h.hero, board().concat(cards[0]), curCatOf(h.hero, board())); rows.push({ label: d.label, cards, first: cards.length / nc.avail * 100, river: cards.length / nc.avail * 100, winIf: null }); } });
    rows = rows.filter(r => r.river >= 0.5 || r.first >= 0.5 || r.cards.length);
    const noneR = S.noneN / S.trials * 100, noneW = S.noneN ? S.noneW / S.noneN * 100 : 0;
    rows.sort((a, b) => b.river - a.river || b.first - a.first);
    const row = r => `<div class="row"><div class="lab"><b>${r.label}${r.cards.length ? ` <span class="note">${r.cards.length} card${r.cards.length > 1 ? 's' : ''}</span>` : ''}</b>${r.cards.length ? miniCards(r.cards) : ''}<div class="trk"><i style="width:${Math.max(1, r.river)}%"></i></div></div><span class="v dim">${pct1(r.first)}</span><span class="v">${pct1(r.river)}</span><span class="v dim">${r.winIf === null ? '—' : pct(r.winIf)}</span></div>`;
    return `<div class="rows"><div class="hd"><span>End with</span><span>${col1}</span><span>By river</span><span>Wins</span></div>${rows.map(row).join('')}<div class="row none"><div class="lab"><b>No improvement</b><div class="trk"><i style="width:${Math.max(1, noneR)}%"></i></div></div><span class="v dim"></span><span class="v">${pct(noneR)}</span><span class="v dim">${pct(noneW)}</span></div></div>`;
  }
  function preflopGrid(hero) {
    const me = handLabel(hero[0], hero[1]); let g = '<div class="g13" aria-label="Starting hand chart">';
    for (let i = 12; i >= 0; i--) for (let j = 12; j >= 0; j--) { const l = i === j ? RANKS[i] + RANKS[i] : i > j ? RANKS[i] + RANKS[j] + 's' : RANKS[j] + RANKS[i] + 'o'; g += `<div class="t${tier(PCT[l])}${l === me ? ' me' : ''}">${l}</div>`; }
    return g + '</div><div class="legend"><span style="--sw:var(--t1)">Top 10%</span><span style="--sw:var(--t2)">20%</span><span style="--sw:var(--t3)">35%</span><span style="--sw:var(--t4)">50%</span><span style="--sw:var(--t5)">Rest</span><span class="term">suited above the diagonal, offsuit below</span></div>';
  }
  function oppStrip() {
    if (!cache.strip) cache.strip = [1, 2, 3, 4, 5, 6, 7, 8].map(k => k === hand.n ? chanceFor(0) : winChanceQuick(hand.hero, [], k, 5, 2500));
    const mx = Math.max(...cache.strip);
    return `<div class="strip">${cache.strip.map((v, i) => `<div class="${i + 1 === hand.n ? 'on' : ''}"><span>${Math.round(v)}</span><i style="height:${Math.max(3, v / mx * 100)}%"></i><span>${i + 1}</span></div>`).join('')}</div>`;
  }
  function threatRows(S, nb) {
    const T = threatsNow(hand.hero, board()); const keys = new Set([...T.groups.keys(), ...S.rivG.keys()]);
    const rows = [...keys].map(k => { const tg = T.groups.get(k); const now = S.nowG.get(k), riv = S.rivG.get(k);
      const pNow = tg ? (1 - Math.pow(1 - tg.combos.length / T.total, hand.n)) * 100 : 0;
      return { label: k, desc: tg ? tg.desc : '', combos: tg ? tg.combos.length : 0, ord: tg ? tg.ord : riv ? riv.ord : 0, now: pNow, river: riv ? riv.n / S.trials * 100 : 0 }; })
      .filter(r => r.now >= 0.5 || r.river >= 0.5 || r.combos);
    const two = nb < 5;
    rows.sort((a, b) => (two ? b.river - a.river : b.now - a.now) || b.ord - a.ord);
    if (!rows.length) return `<p class="note">Nothing beats this hand right now${two ? ', and nothing can by the river' : ''}.</p>`;
    const row = r => `<div class="row"><div class="lab"><b>${r.label}</b>${r.desc ? `<span class="note">${r.desc}${r.combos ? ` · ${r.combos} hand${r.combos > 1 ? 's' : ''}` : ''}</span>` : '<span class="note">needs a card to come</span>'}<div class="trk"><i style="width:${Math.max(1, two ? r.river : r.now)}%"></i></div></div><span class="v">${pct1(r.now)}</span>${two ? `<span class="v">${pct1(r.river)}</span>` : ''}</div>`;
    const LIM = 4, extra = rows.length - LIM;
    return `<div class="rows r${two ? 2 : 1}" id="threats"><div class="hd"><span>Beaten by</span><span>Now</span>${two ? '<span>By river</span>' : ''}</div>${rows.map((r, i) => row(r).replace('class="row"', i >= LIM ? 'class="row hid"' : 'class="row"')).join('')}</div>` + (extra > 0 ? `<button class="more" data-more="threats" data-n="${extra}">Show ${extra} more</button>` : '');
  }
  function topBlock(S, chance) {
    const h = hand, n = h.n, nb = BOARD_N[step], bd = board(), vs = `vs ${n} random hand${n > 1 ? 's' : ''}`;
    const hn = step === 0 ? `${preflopShort(h.hero)}<span class="note">top ${Math.round(PCT[handLabel(h.hero[0], h.hero[1])])}% of starting hands</span>` : (d => `${cap(d.text)}${d.shared ? ` <span class="chip hot">shared</span>` : ''}`)(describe(h.hero, bd));
    if (needGuess()) return blk('Your hand', `<div class="top"><div class="l1"><span class="hn">${hn}</span><span class="guess"><input type="number" id="guessIn" min="0" max="100" inputmode="decimal" aria-label="Your guess, percent" placeholder="%"><button class="primary" id="guessBtn">Reveal</button></span></div><div class="l2"><span>Your guess: chance to win ${vs}?</span></div></div>`);
    const g = guessed[step] != null ? `<span>guess ${Math.round(guessed[step])}% · off by ${Math.round(Math.abs(guessed[step] - chance))}</span>` : '';
    return blk('Your hand', `<div class="top"><div class="l1"><span class="hn">${hn}</span><span class="pc">${pct(chance)}</span></div><div class="l2"><span>${odds(chance)} · ${vs}</span>${g}</div></div>`);
  }
  function renderPane() {
    const h = hand, n = h.n, nb = BOARD_N[step], vs = `vs ${n} random hand${n > 1 ? 's' : ''}`;
    let html = '';
    if (step === 4) {
      const full = h.board, d = describe(h.hero, full), w = winners();
      if (tab === 'read') {
        html += `<div class="big">${w.includes(0) ? (w.length > 1 ? 'Split' : 'Won') : 'Lost'}<small>${d.text}</small></div>`;
        html += `<h3>Chance to win, by street</h3><div class="timeline">${[0, 1, 2, 3].map(s => `<div class="pt"><span class="k">${STEP[s]}</span><span class="v">${pct(chanceFor(s))}</span></div>`).join('')}</div>`;
        html += `<h3>Hands</h3><ul>${h.opps.map((o, i) => `<li><b>${h.names[i]}</b> ${miniCards(o)} ${describe(o, full).text}${w.includes(i + 1) ? ' ← winner' : ''}</li>`).join('')}</ul>`;
      } else html += `<p class="note">Hand over. Deal again, or use Back to revisit a street.</p>`;
      $('pane').innerHTML = html; return;
    }
    if (needGuess()) { $('pane').innerHTML = topBlock(null, 0) + guessHist(); $('guessBtn').addEventListener('click', revealGuess); $('guessIn').addEventListener('keydown', e => { if (e.key === 'Enter') revealGuess(); }); $('guessIn').focus(); return; }
    const S = sim(step), chance = S.chance;
    if (tab === 'read') {
      html += topBlock(S, chance);
      if (step === 0) {
        html += blk('Starting hand chart', preflopGrid(h.hero));
        html += blk('Chance to win by number of opponents', oppStrip());
        html += blk(`Where this hand ends up <small>${vs}</small>`, improvementRows(S, nb) + `<p class="note">Rows are the hand you finish with. "Wins" is how often that finished hand takes the pot.</p>`);
      } else {
        if (nb < 5) {
          if (S.list.length) html += blk(`Where this hand ends up <small>${vs}</small>`, improvementRows(S, nb) + `<p class="note">Rows are the hand you finish with. "Wins" is how often that finished hand takes the pot.</p>`);
          else html += blk('Where this hand ends up', `<p class="note">No card to come can improve this hand. It wins ${pct(chance)} as it stands.</p>`);
        }
        html += blk(`What beats you <small>now ${pct(nb < 5 ? S.nowBeat : 100 - chance)}${nb < 5 ? ` · by river ${pct(S.rivBeat)}` : ''}</small>`, threatRows(S, nb) + `<p class="note">"Now": chance at least one of ${n} random hand${n > 1 ? 's' : ''} already holds it.${nb < 5 ? ' "By river": chance you lose to it once all cards are out.' : ''} Hands listed are the actual two-card holdings that do it on this board.</p>`);
      }
      html += guessHist();
    } else if (tab === 'bets') {
      const pot = h.potStart[step] || h.potShow[0], live = step > 0 ? h.bet[step] : null;
      const sizes = [[0.5, 'Half pot'], [1, 'Pot'], [2, 'Double pot']].map(([f, l]) => [Math.round(pot * f), l]);
      if (live) sizes.unshift([live, `${h.names[h.bettor[step]]}'s bet`]);
      html += blk(`If someone bets into ${money(pot)}`, `<table><tr><th>Bet</th><th>You call</th><th>Need</th><th>You have</th></tr>${sizes.map(([b, l], i) => { const need = b / (pot + 2 * b) * 100; return `<tr class="${live && i === 0 ? 'live' : ''}"><td><span class="n">${money(b)}</span><br><span class="note">${l}</span></td><td class="n">${money(b)} → ${money(pot + b)}</td><td class="n">${pct(need)}</td><td class="n" style="color:var(--${need < chance ? 'good' : 'bad'})">${pct(chance)}</td></tr>`; }).join('')}</table><p class="note">Need = your call ÷ pot after calling. Call when "you have" beats "need" <span class="term">(pot odds)</span>.${step < 3 ? ' Rough with cards to come.' : ''}</p>`);
    }
    $('pane').innerHTML = html;
  }
  const blk = (title, body) => `<section class="blk"><h3>${title}</h3>${body}</section>`;
  function guessHist() { const g = guesses.slice(-20); return g.length ? `<p class="note">Guess record: off by ${Math.round(g.reduce((s, x) => s + Math.abs(x), 0) / g.length)} on average, last ${g.length}.</p>` : ''; }
  function revealGuess() { const v = parseFloat($('guessIn').value); const g = isNaN(v) ? null : v; guessed[step] = g; if (g !== null) { guesses.push(g - chanceFor(step)); if (guesses.length > 100) guesses.shift(); try { localStorage.setItem('walkthrough.guesses', JSON.stringify(guesses)); } catch (e) {} } renderPane(); }
  function renderAll() { renderTable(); renderPane(); }
  const go = s => { step = Math.max(0, Math.min(4, s)); delete cache.beat; renderAll(); };

  $('dealBtn').addEventListener('click', () => deal());
  $('nextBtn').addEventListener('click', () => { if (step === 4) deal(); else go(step + 1); });
  $('backBtn').addEventListener('click', () => go(step - 1));
  $('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
  $('nOpp').addEventListener('change', () => deal());
  $('guessFirst').addEventListener('change', renderPane);
  $('showTerms').addEventListener('change', () => document.body.classList.toggle('terms', $('showTerms').checked));
  $('pane').addEventListener('click', e => { const b = e.target.closest('[data-more]'); if (!b) return; const box = $(b.dataset.more); const open = b.dataset.open === '1'; box.querySelectorAll('.row.hid, .row.was-hid').forEach(r => { r.classList.toggle('hid', open); r.classList.add('was-hid'); }); b.dataset.open = open ? '0' : '1'; b.textContent = open ? `Show ${b.dataset.n} more` : 'Show fewer'; });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false')); renderPane(); }));
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('nextBtn').click(); } if (e.key === 'ArrowLeft') go(step - 1); if (e.key.toLowerCase() === 'n') deal(); });
  deal();
})();
</script>
