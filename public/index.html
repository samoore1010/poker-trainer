<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Walkthrough Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one-screen poker client. Oval felt table on the left (seats with action chips around the rim, board + pot in the middle, your cards at the bottom with the made hand glowing); a progression bar with a card picker beneath it; a tabbed advisor panel of numbers and small charts on the right. Stacks on phones. */
  :root {
    --bg: #d9ded8; --room: #c3cac2; --panel: #f6f7f4; --fg: #1b221e; --muted: #5d6862; --line: #c4ccc5; --track: #dfe4de;
    --felt: #2d6a4d; --felt-dark: #1d4a35; --rail: #4a2e1f; --rail-hi: #6b4530;
    --accent: #e0674f; --accent-ink: #1a0d0a; --good: #2f7d4f; --warn: #b27a12; --bad: #b8402e; --glow: #ffd36a;
    --t1: #2f7d4f; --t2: #6aa36f; --t3: #b8c98f; --t4: #d9d6b0; --t5: #e9e8e0;
    --card-face: #fdfdfb; --card-red: #c1302a; --card-black: #17201b;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
      --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
      --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
      --card-face: #f4f2ec; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
    --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
    --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
    --card-face: #f4f2ec; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: .02em; margin-right: auto; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: .82rem; flex-wrap: wrap; }
  .opts label { display: inline-flex; gap: 5px; align-items: center; }
  select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
  button { font: 500 .88rem var(--body); padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .room { background: radial-gradient(ellipse at 50% 40%, var(--room), var(--bg)); display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 14px 16px 10px; gap: 10px; }
  .tablewrap { position: relative; min-height: 0; display: grid; place-items: center; }
  .table { position: relative; width: min(100%, calc((100vh - 200px) * 1.7)); aspect-ratio: 1.7; max-width: 100%; border-radius: 50% / 50%; background: radial-gradient(ellipse at 50% 45%, var(--felt), var(--felt-dark)); box-shadow: 0 0 0 10px var(--rail), 0 0 0 12px var(--rail-hi), 0 18px 40px rgba(0,0,0,.45), inset 0 0 60px rgba(0,0,0,.35); }
  .table::before { content: ""; position: absolute; inset: 7%; border: 2px solid rgba(255,255,255,.12); border-radius: 50%; pointer-events: none; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; gap: 8px; justify-items: center; }
  .board { display: flex; gap: 5px; }
  .pot { font: 600 .95rem var(--mono); color: #fff; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 14px; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
  .pot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: repeating-conic-gradient(#e63946 0 30deg, #fff 30deg 60deg); border: 2px solid #b12a35; }
  .pot.win { background: var(--good); }
  .card { width: 44px; height: 62px; border-radius: 6px; background: var(--card-face); color: var(--card-black); display: grid; grid-template-rows: auto 1fr; padding: 4px 5px; font-family: var(--mono); font-weight: 600; box-shadow: 0 2px 4px rgba(0,0,0,.4); position: relative; }
  .card .r { font-size: 1rem; line-height: 1; } .card .s { font-size: 1.35rem; line-height: 1; align-self: end; justify-self: end; }
  .card.red { color: var(--card-red); }
  .card.sm { width: 30px; height: 42px; padding: 2px 3px; border-radius: 4px; } .card.sm .r { font-size: .7rem; } .card.sm .s { font-size: .9rem; }
  .card.lg { width: 54px; height: 76px; } .card.lg .r { font-size: 1.2rem; } .card.lg .s { font-size: 1.6rem; }
  .card.back { background: repeating-linear-gradient(45deg, #7a2a2a 0 5px, #5e1f1f 5px 10px); border: 2px solid #f1e6d6; }
  .card.glow { box-shadow: 0 0 0 2px var(--glow), 0 0 16px 5px rgba(255,211,106,.55); }
  .card.dim { opacity: .55; }
  .slot { width: 44px; height: 62px; border-radius: 6px; border: 2px dashed rgba(255,255,255,.3); }
  .seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 3px; width: 110px; }
  .seat .cards { display: flex; gap: 3px; min-height: 42px; }
  .seat .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#5b6d78, #36464f); border: 2px solid rgba(255,255,255,.5); display: grid; place-items: center; font: 700 .9rem var(--display); color: #fff; }
  .nm { font: 600 .72rem var(--body); color: #fff; background: rgba(0,0,0,.45); padding: 1px 8px; border-radius: 10px; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .st { font: 500 .7rem var(--mono); color: #d8e4dc; }
  .seat.win .av { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(255,211,106,.5); }
  .seat.win .nm { background: var(--glow); color: #3a2a00; }
  .act { font: 600 .66rem var(--mono); padding: 2px 7px; border-radius: 3px; white-space: nowrap; background: rgba(0,0,0,.5); color: #e8eee9; }
  .act.bet { background: var(--accent); color: var(--accent-ink); }
  .act.you { background: #fff; color: #1b221e; }
  .hero { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
  .hero .cards { display: flex; gap: 5px; }
  .hero .line { display: flex; gap: 6px; align-items: center; }

  /* Progression bar */
  .prog { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .steps { display: flex; align-items: center; gap: 0; min-width: 0; overflow: hidden; }
  .steps button { border: 0; background: none; padding: 4px 6px; display: grid; justify-items: center; gap: 4px; font: 600 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 64px; }
  .steps button i { display: block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }
  .steps button.done i { background: var(--fg); border-color: var(--fg); }
  .steps button.on { color: var(--fg); } .steps button.on i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,103,79,.3); }
  .steps .seg { flex: 1; height: 2px; background: var(--line); min-width: 10px; }
  .steps .seg.done { background: var(--fg); }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ctl .hint { font-size: .78rem; color: var(--muted); margin-right: 4px; }
  .ctl button.ghost { background: transparent; }
  .ctl button[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Card picker */
  .picker { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: grid; gap: 10px; max-height: calc(100vh - 160px); overflow: auto; }
  .picker[hidden] { display: none; }
  .pk-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .82rem; }
  .pk-head .x { margin-left: auto; padding: 4px 9px; font-size: 1rem; line-height: 1; }
  .slots { display: flex; gap: 6px; align-items: center; }
  .slots .lbl { font: 600 .66rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .slot-s { width: 34px; height: 46px; border-radius: 5px; border: 2px dashed var(--line); display: grid; place-items: center; cursor: pointer; background: var(--bg); }
  .slot-s.filled { border-style: solid; }
  .slot-s.next { border-color: var(--accent); }
  .slot-s .card { width: 100%; height: 100%; box-shadow: none; }
  .slots .gap { width: 10px; }
  .deck { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; max-width: 560px; }
  .deck button { padding: 0; height: 30px; font: 600 .74rem var(--mono); border-radius: 4px; background: var(--card-face); color: var(--card-black); border: 1px solid var(--line); display: grid; place-items: center; }
  .deck button.red { color: var(--card-red); }
  .deck button.used { opacity: .25; cursor: default; }
  .deck button.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pk-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .say { display: flex; gap: 6px; align-items: center; }
  .say input { flex: 1; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .say #micBtn { font-size: 1rem; padding: 5px 9px; } .say #micBtn.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sayNote.err { color: var(--bad); }
  .meter { width: 46px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; flex: none; }
  .meter[hidden] { display: none; }
  .meter i { display: block; height: 100%; width: calc(var(--lvl, 0) * 100%); background: var(--good); transition: width .06s linear; }
  .ask { flex: 1 1 420px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0; min-width: 0; }
  .ask[hidden] { display: none; }
  .ask input { flex: 1 1 200px; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .ask #askMic { font-size: 1rem; padding: 5px 9px; } .ask #askMic.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ask.busy input { opacity: .6; }
  .ask .sayNote { flex: 1 1 100%; margin: 0; }
  .note.err { color: var(--bad); }
  .calc { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .seat.folded { opacity: .45; }
  .seat .av { font-size: .7rem; letter-spacing: .02em; }
  .rg { font: 500 .6rem var(--mono); color: #f3e3b3; background: rgba(0,0,0,.35); padding: 0 6px; border-radius: 8px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.known { box-shadow: 0 0 0 2px #f3e3b3, 0 2px 4px rgba(0,0,0,.4); }
  .act.fold { background: rgba(0,0,0,.3); color: #b9c3bd; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chg { font: 500 .7rem var(--body); padding: 2px 7px; border-radius: 10px; background: var(--track); color: var(--fg); }
  .reply { font-size: .88rem; }
  .msg { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; font-size: .86rem; }
  .msg p { margin: 0; }
  .msg.user { background: color-mix(in srgb, var(--accent) 14%, transparent); justify-self: end; max-width: 90%; }
  .msg.assistant { border: 1px solid var(--line); }
  .sugg { display: grid; gap: 6px; }
  .sugg button { text-align: left; font-size: .8rem; line-height: 1.35; }
  ul.opps { font-size: .8rem; }
  .advice .adv-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .advice .adv-act { font: 700 1.9rem var(--display); letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
  .advice.bad .adv-act { color: var(--bad); } .advice.good .adv-act { color: var(--good); } .advice.mid .adv-act { color: var(--warn); }
  .advice .adv-size { font: 600 .95rem var(--mono); }
  .gauge { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 22px; border-radius: 6px; overflow: visible; margin: 4px 0 2px; }
  .gauge span { display: grid; place-items: center; font: 600 .62rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  .gauge span:nth-child(1) { background: color-mix(in srgb, var(--bad) 75%, transparent); border-radius: 6px 0 0 6px; }
  .gauge span:nth-child(2) { background: color-mix(in srgb, var(--warn) 75%, transparent); }
  .gauge span:nth-child(3) { background: color-mix(in srgb, var(--good) 75%, transparent); border-radius: 0 6px 6px 0; }
  .gauge i { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); transition: left .25s ease; }
  .adv-why { font-size: .8rem; }
  .spk { padding: 1px 7px; font-size: .9rem; line-height: 1.2; border-color: transparent; background: transparent; }
  .pk-act .note { margin-right: auto; }

  /* Advisor */
  .advisor { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px 4px; font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pane { overflow-y: auto; padding: 14px 16px 20px; display: grid; gap: 12px; align-content: start; min-height: 0; }
  .blk { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 8px; background: color-mix(in srgb, var(--bg) 55%, var(--panel)); }
  .blk > h3 { margin: 0 0 2px; }
  .pane h3 { font: 700 .74rem var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
  .pane h3 small { font: 500 .68rem var(--body); text-transform: none; letter-spacing: 0; }
  .pane p { margin: 0; }
  .top { display: grid; gap: 2px; }
  .top .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .top .l1 .hn { font-size: 1.05rem; font-weight: 500; }
  .top .l1 .hn .note { display: block; }
  .top .l1 .pc { font: 600 1.7rem var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
  .top .l2 { font-size: .78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .top .guess { display: flex; gap: 6px; align-items: center; }
  .top .guess input { width: 64px; font: 600 1rem var(--mono); padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); text-align: right; }
  .top .guess button { padding: 4px 10px; font-size: .78rem; }
  .big { font: 600 2rem var(--mono); font-variant-numeric: tabular-nums; line-height: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .big small { font: 400 .8rem var(--body); color: var(--muted); }
  .note { font-size: .76rem; color: var(--muted); }
  .n { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .term { color: var(--muted); font-size: .88em; }
  body:not(.terms) .term { display: none; }
  .mini { display: inline-flex; gap: 2px; vertical-align: middle; flex-wrap: wrap; }
  .mini span { font: 600 .62rem var(--mono); padding: 0 3px; border-radius: 2px; background: var(--card-face); color: var(--card-black); }
  .mini span.red { color: var(--card-red); }
  .more { justify-self: start; font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 0; border: 0; background: none; color: var(--accent); }
  .rows { display: grid; gap: 7px; }
  .rows .hd, .row { display: grid; grid-template-columns: minmax(0, 1fr) 46px 46px 50px; gap: 8px; align-items: center; }
  .rows.r2 .hd, .rows.r2 .row { grid-template-columns: minmax(0, 1fr) 50px 56px; }
  .rows.r1 .hd, .rows.r1 .row { grid-template-columns: minmax(0, 1fr) 56px; }
  .rows.r2 .trk i, .rows.r1 .trk i { background: var(--bad); }
  .rows .row.hid { display: none; }
  .rows .hd { font: 500 .62rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
  .rows .hd span:first-child { text-align: left; }
  .row .lab { font-size: .84rem; display: grid; gap: 3px; min-width: 0; }
  .row .lab b { font-weight: 500; }
  .row .trk { height: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .row .trk i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
  .row .v { font: 600 .84rem var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .row .v.dim { color: var(--muted); font-weight: 400; }
  .row.none .lab b, .row.none .v { color: var(--muted); font-weight: 400; }
  .row.none .trk i { background: var(--line); }
  .chip { font: 600 .68rem var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; background: var(--track); color: var(--fg); }
  .chip.hot { background: var(--warn); color: #fff; }
  .strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; align-items: end; height: 54px; }
  .strip div { display: grid; grid-template-rows: auto 1fr auto; height: 100%; justify-items: center; font: 500 .62rem var(--mono); color: var(--muted); }
  .strip div i { width: 100%; align-self: end; background: var(--line); border-radius: 2px 2px 0 0; }
  .strip div.on { color: var(--fg); font-weight: 600; } .strip div.on i { background: var(--accent); }
  .g13 { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; font: 500 .56rem var(--mono); }
  .g13 div { aspect-ratio: 1; display: grid; place-items: center; border-radius: 2px; color: var(--fg); overflow: hidden; }
  .g13 .t1 { background: var(--t1); color: #fff; } .g13 .t2 { background: var(--t2); color: #fff; } .g13 .t3 { background: var(--t3); } .g13 .t4 { background: var(--t4); } .g13 .t5 { background: var(--t5); color: var(--muted); }
  .g13 .me { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 600; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .68rem; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--sw); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .82rem; width: 100%; }
  td, th { padding: 5px 6px 5px 0; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 500 .64rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  td.n { white-space: nowrap; }
  tr.live td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .timeline { display: flex; gap: 5px; flex-wrap: wrap; }
  .timeline .pt { display: grid; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; min-width: 70px; }
  .timeline .pt .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .timeline .pt .v { font: 600 .95rem var(--mono); }
  ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-size: .84rem; }

  @media (max-width: 860px) {

    const size = !r.size ? '' : r.action === 'raise' ? `to ${money(r.size)}` : `${money(r.size)} · about ${Math.round(r.size / pot * 100)}% of the pot`;
    return `<section class="blk advice ${cls}"><h3>What you should do <small>rule of thumb, not a solver</small></h3>
      <div class="adv-top"><span class="adv-act">${esc(r.label)}</span>${size ? `<span class="adv-size">${size}</span>` : ''}${r.close ? '<span class="chip">close call</span>' : ''}</div>
      <div class="gauge" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.gauge}" aria-label="Recommendation strength from fold to raise"><span>Fold</span><span>Check · Call</span><span>Bet · Raise</span><i style="left:${r.gauge}%"></i></div>
      <ul class="adv-why">${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}</section>`;
  }
  function rangeList(s) {
    const seats = liveSeats(s); if (!seats.length) return '';
    return `<ul class="opps">${seats.map(seat => { const o = scenario.opponents[seat - 1]; return `<li><b>${esc(o.name)}</b> <span class="note">${esc(hand.pos[seat])}</span> ${esc(SC.rangeLabel(o))}</li>`; }).join('')}</ul>`;
  }
  function topBlock(S, chance) {
    const h = hand, bd = board(), vs = vsLabel(step);
    const hn = step === 0 ? `${preflopShort(h.hero)}<span class="note">top ${Math.round(PCT[handLabel(h.hero[0], h.hero[1])])}% of starting hands</span>` : (d => `${cap(d.text)}${d.shared ? ` <span class="chip hot">shared</span>` : ''}`)(describe(h.hero, bd));
    if (needGuess()) return blk('Your hand', `<div class="top"><div class="l1"><span class="hn">${hn}</span><span class="guess"><input type="number" id="guessIn" min="0" max="100" inputmode="decimal" aria-label="Your guess, percent" placeholder="%"><button class="primary" id="guessBtn">Reveal</button></span></div><div class="l2"><span>Your guess: chance to win ${vs}?</span></div></div>`);
    if (chance === null) return blk('Your hand', `<div class="top"><div class="l1"><span class="hn">${hn}</span><span class="pc calc">…</span></div><div class="l2"><span>Calculating ${vs}</span></div></div>`);
    if (guessed[step] != null && !counted[step]) { counted[step] = true; guesses.push(guessed[step] - chance); if (guesses.length > 100) guesses.shift(); store.set('walkthrough.guesses', guesses); }
    const g = guessed[step] != null ? `<span>guess ${Math.round(guessed[step])}% · off by ${Math.round(Math.abs(guessed[step] - chance))}</span>` : '';
    const spk = HV && HV.api.has('speak') ? ' <button class="spk" data-speak aria-label="Read this hand aloud" title="Read aloud">🔊</button>' : '';
    const how = S && S.exact ? ' · <span class="chip">exact</span>' : '';
    const warn = S && S.warnings && S.warnings.length ? `<p class="note err">${esc(S.warnings.join(' '))}</p>` : '';
    return blk('Your hand' + spk, `<div class="top"><div class="l1"><span class="hn">${hn}</span><span class="pc">${pct(chance)}</span></div><div class="l2"><span>${odds(chance)} · ${vs}${how}</span>${g}</div></div>${warn}`);
  }
  function renderPane() {
    const h = hand, nb = BOARD_N[step];
    let html = '';
    if (tab === 'coach') { $('pane').innerHTML = renderCoach(); const last = $('pane').lastElementChild; if (last) last.scrollIntoView({ block: 'end' }); return; }
    if (step === 4) {
      const full = h.board, d = describe(h.hero, full), w = winners();
      if (tab === 'read') {
        html += `<div class="big">${w.includes(0) ? (w.length > 1 ? 'Split' : 'Won') : 'Lost'}<small>${d.text}</small></div>`;
        html += `<h3>Chance to win, by street</h3><div class="timeline">${[0, 1, 2, 3].map(s => { const c = chanceFor(s); return `<div class="pt"><span class="k">${STEP[s]}</span><span class="v">${c === null ? '…' : pct(c)}</span></div>`; }).join('')}</div>`;
        html += `<h3>Hands</h3><ul>${scenario.opponents.map((o, i) => { const folded = h.m.foldedAt[i + 1] !== null; return `<li><b>${esc(o.name)}</b> ${folded ? '<span class="note">folded</span>' : `${miniCards(h.opps[i])} ${describe(h.opps[i], full).text}${w.includes(i + 1) ? ' ← winner' : ''}`}</li>`; }).join('')}</ul>`;
      } else html += `<p class="note">Hand over. Deal again, or use Back to revisit a street.</p>`;
      $('pane').innerHTML = html; return;
    }
    if (needGuess()) { $('pane').innerHTML = topBlock(null, 0) + guessHist(); $('guessBtn').addEventListener('click', revealGuess); $('guessIn').addEventListener('keydown', e => { if (e.key === 'Enter') revealGuess(); }); $('guessIn').focus(); sim(step); return; }
    const S = sim(step), chance = S ? S.chance : null;
    if (tab === 'read') {
      html += S ? adviceBlock(S) : blk('What you should do', '<p class="note calc">Reading the spot…</p>');
      html += topBlock(S, chance);
      const vs = vsLabel(step), live = liveSeats(step).length;
      if (!S) html += blk('Working', '<p class="note calc">Running the numbers…</p>');
      else if (step === 0) {
        html += blk('Starting hand chart', preflopGrid(h.hero));
        html += blk('Chance to win by number of opponents', oppStrip());
        html += blk(`Where this hand ends up <small>${vs}</small>`, improvementRows(S, nb) + `<p class="note">Rows are the hand you finish with. "Wins" is how often that finished hand takes the pot.</p>`);
      } else {
        if (nb < 5) {
          if (S.list.length) html += blk(`Where this hand ends up <small>${vs}</small>`, improvementRows(S, nb) + `<p class="note">Rows are the hand you finish with. "Wins" is how often that finished hand takes the pot.</p>`);
          else html += blk('Where this hand ends up', `<p class="note">No card to come can improve this hand. It wins ${pct(chance)} as it stands.</p>`);
        }
        if (live) html += blk(`What beats you <small>now ${pct(nb < 5 ? S.nowBeat : 100 - chance)}${nb < 5 ? ` · by river ${pct(S.rivBeat)}` : ''}</small>`, threatRows(S, nb) + `<p class="note">"Now": chance at least one live opponent${anyRanges(step) ? ', given their likely hands,' : ''} already holds it.${nb < 5 ? ' "By river": chance you lose to it once all cards are out.' : ''}</p>`);
      }
      if (anyRanges(step)) html += blk('Opponents', rangeList(step));
      html += guessHist();
    } else if (tab === 'bets') {
      const m = h.m, s = step, st = scenario.streets[s];
      const pot = m.potStart[s] || m.potShow[0], facing = st.aggressor !== null && st.aggressor !== 0 && s > 0 ? m.level[s] : null;
      const sizes = [[0.5, 'Half pot'], [1, 'Pot'], [2, 'Double pot']].map(([f, l]) => [Math.round(pot * f), l]);
      if (facing) sizes.unshift([facing, `${scenario.opponents[st.aggressor - 1].name}'s bet`]);
      const have = chance === null ? null : chance;
      html += blk(`If someone bets into ${money(pot)}`, `<table><tr><th>Bet</th><th>You call</th><th>Need</th><th>You have</th></tr>${sizes.map(([b, l], i) => { const need = b / (pot + 2 * b) * 100; return `<tr class="${facing && i === 0 ? 'live' : ''}"><td><span class="n">${money(b)}</span><br><span class="note">${esc(l)}</span></td><td class="n">${money(b)} → ${money(pot + b)}</td><td class="n">${pct(need)}</td><td class="n" style="color:var(--${have === null ? 'muted' : need < have ? 'good' : 'bad'})">${have === null ? '…' : pct(have)}</td></tr>`; }).join('')}</table><p class="note">Need = your call ÷ pot after calling. Call when "you have" beats "need" <span class="term">(pot odds)</span>.${step < 3 ? ' Rough with cards to come.' : ''}</p>`);
    }
    $('pane').innerHTML = html;
  }
  const blk = (title, body) => `<section class="blk"><h3>${title}</h3>${body}</section>`;
  function guessHist() { const g = guesses.slice(-20); return g.length ? `<p class="note">Guess record: off by ${Math.round(g.reduce((s, x) => s + Math.abs(x), 0) / g.length)} on average, last ${g.length}.</p>` : ''; }
  function revealGuess() { const v = parseFloat($('guessIn').value); guessed[step] = isNaN(v) ? null : v; renderPane(); }
  function renderAll() { renderTable(); renderPane(); }
  const go = s => { step = Math.max(0, Math.min(4, s)); commitRevealed(); renderAll(); };

  $('dealBtn').addEventListener('click', newHand);
  $('nextBtn').addEventListener('click', () => { if (step === 4) newHand(); else go(step + 1); });
  $('backBtn').addEventListener('click', () => go(step - 1));
  $('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
  $('nOpp').addEventListener('change', () => edit('setup_table', { opponents: +$('nOpp').value }));
  $('guessFirst').addEventListener('change', renderPane);
  $('showTerms').addEventListener('change', () => document.body.classList.toggle('terms', $('showTerms').checked));
  async function speakHand(btn) {
    const chance = chanceFor(step); if (chance === null) return;
    const name = step === 0 ? `${preflopShort(hand.hero)}, top ${Math.round(PCT[handLabel(hand.hero[0], hand.hero[1])])} percent of starting hands` : describe(hand.hero, board()).text.replace(/<[^>]+>/g, '');
    const text = `${cap(name)}. About ${Math.round(chance)} percent to win ${vsLabel(step).replace(/^vs/, 'against')}, ${odds(chance)}.`;
    btn.disabled = true;
    try { await HV.speak(text); }
    catch (e) { btn.textContent = '⚠'; btn.title = e.message || 'Could not play audio'; setTimeout(() => { btn.textContent = '🔊'; btn.title = 'Read aloud'; }, 4000); }
    finally { btn.disabled = false; }
  }
  function setTab(t) { tab = t; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === t ? 'true' : 'false')); renderPane(); }
  $('pane').addEventListener('click', e => {
    const sp = e.target.closest('[data-speak]'); if (sp) { speakHand(sp); return; }
    const tg = e.target.closest('[data-tab-go]'); if (tg) { setTab(tg.dataset.tabGo); return; }
    const sg = e.target.closest('[data-suggest]'); if (sg) { $('askIn').value = sg.dataset.suggest; askAgent(sg.dataset.suggest); return; }
    if (e.target.closest('[data-clear-coach]')) { coachLog = []; lastReply = null; store.set('walkthrough.coach', []); renderPane(); return; }
    const b = e.target.closest('[data-more]'); if (!b) return; const box = $(b.dataset.more); const open = b.dataset.open === '1'; box.querySelectorAll('.row.hid, .row.was-hid').forEach(r => { r.classList.toggle('hid', open); r.classList.add('was-hid'); }); b.dataset.open = open ? '0' : '1'; b.textContent = open ? `Show ${b.dataset.n} more` : 'Show fewer';
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('nextBtn').click(); } if (e.key === 'ArrowLeft') go(step - 1); if (e.key.toLowerCase() === 'n') newHand(); if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

  // Server features light up once /api/status answers (nothing changes when the page is opened from disk).
  if (HV) HV.api.init().then(() => {
    if (HV.api.has('transcribe') && HV.recordingSupported()) {
      voiceMode = 'cloud'; micBtn.hidden = false; micBtn.disabled = false; micBtn.title = 'Speak';
      if (!SR) sayNote(NOTE0);
    }
    if (HV.api.has('agent')) {
      $('askForm').hidden = false;
      $('askMic').hidden = !(HV.api.has('transcribe') && HV.recordingSupported());
      $('coachTab').hidden = false;
    }
    if (hand) renderPane();
  });

  // Start from the last scenario on this device, or a fresh table.
  const saved = store.get('walkthrough.scenario');
  coachLog = store.get('walkthrough.coach') || [];
  const lastA = [...coachLog].reverse().find(x => x.role === 'assistant'); if (lastA) lastReply = { text: lastA.text, changes: lastA.changes || [] };
  if (saved && saved.scenario) loadScenario(saved.scenario, { prev: saved.hand || null });
  else loadScenario(SC.create({ opponents: +$('nOpp').value }), { prev: null });
})();
</script>
