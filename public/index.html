<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Walkthrough Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one-screen poker client. Oval felt table on the left (seats with action chips around the rim, board + pot in the middle, your cards at the bottom with the made hand glowing); a progression bar with a card picker beneath it; a tabbed advisor panel of numbers and small charts on the right. Stacks on phones. */
  :root {
    --bg: #d9ded8; --room: #c3cac2; --panel: #f6f7f4; --fg: #1b221e; --muted: #5d6862; --line: #c4ccc5; --track: #dfe4de;
    --felt: #2d6a4d; --felt-dark: #1d4a35; --rail: #4a2e1f; --rail-hi: #6b4530;
    --accent: #e0674f; --accent-ink: #1a0d0a; --good: #2f7d4f; --warn: #b27a12; --bad: #b8402e; --glow: #ffd36a;
    --t1: #2f7d4f; --t2: #6aa36f; --t3: #b8c98f; --t4: #d9d6b0; --t5: #e9e8e0;
    --card-face: #fdfdfb; --card-red: #c1302a; --card-black: #17201b; --card-blue: #1f5fcf; --card-green: #1d8a3c;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
      --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
      --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
      --card-face: #f4f2ec; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
    --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
    --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
    --card-face: #f4f2ec; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: .02em; margin-right: auto; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: .82rem; flex-wrap: wrap; }
  .opts label { display: inline-flex; gap: 5px; align-items: center; }
  select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
  button { font: 500 .88rem var(--body); padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .room { background: radial-gradient(ellipse at 50% 40%, var(--room), var(--bg)); display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 14px 16px 10px; gap: 10px; }
  .tablewrap { position: relative; min-height: 0; display: grid; place-items: center; }
  .table { position: relative; width: min(100%, calc((100vh - 200px) * 1.7)); aspect-ratio: 1.7; max-width: 100%; border-radius: 50% / 50%; background: radial-gradient(ellipse at 50% 45%, var(--felt), var(--felt-dark)); box-shadow: 0 0 0 10px var(--rail), 0 0 0 12px var(--rail-hi), 0 18px 40px rgba(0,0,0,.45), inset 0 0 60px rgba(0,0,0,.35); }
  .table::before { content: ""; position: absolute; inset: 7%; border: 2px solid rgba(255,255,255,.12); border-radius: 50%; pointer-events: none; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; gap: 8px; justify-items: center; }
  .board { display: flex; gap: 5px; }
  .pot { font: 600 .95rem var(--mono); color: #fff; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 14px; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
  .pot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: repeating-conic-gradient(#e63946 0 30deg, #fff 30deg 60deg); border: 2px solid #b12a35; }
  .pot.win { background: var(--good); }
  .card { width: 44px; height: 62px; border-radius: 6px; background: var(--card-face); color: var(--card-black); display: grid; grid-template-rows: auto 1fr; padding: 4px 5px; font-family: var(--mono); font-weight: 600; box-shadow: 0 2px 4px rgba(0,0,0,.4); position: relative; }
  .card .r { font-size: 1rem; line-height: 1; } .card .s { font-size: 1.35rem; line-height: 1; align-self: end; justify-self: end; }
  .card.red { color: var(--card-red); }
  body.four .card.su-d { color: var(--card-blue); } body.four .card.su-c { color: var(--card-green); }
  .card.sm { width: 30px; height: 42px; padding: 2px 3px; border-radius: 4px; } .card.sm .r { font-size: .7rem; } .card.sm .s { font-size: .9rem; }
  .card.lg { width: 54px; height: 76px; } .card.lg .r { font-size: 1.2rem; } .card.lg .s { font-size: 1.6rem; }
  .card.back { background: repeating-linear-gradient(45deg, #7a2a2a 0 5px, #5e1f1f 5px 10px); border: 2px solid #f1e6d6; }
  .card.glow { box-shadow: 0 0 0 2px var(--glow), 0 0 16px 5px rgba(255,211,106,.55); }
  .card.dim { opacity: .55; }
  .slot { width: 44px; height: 62px; border-radius: 6px; border: 2px dashed rgba(255,255,255,.3); }
  .seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 3px; width: 110px; }
  .seat .cards { display: flex; gap: 3px; min-height: 42px; }
  .seat .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#5b6d78, #36464f); border: 2px solid rgba(255,255,255,.5); display: grid; place-items: center; font: 700 .9rem var(--display); color: #fff; }
  .nm { font: 600 .72rem var(--body); color: #fff; background: rgba(0,0,0,.45); padding: 1px 8px; border-radius: 10px; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .st { font: 500 .7rem var(--mono); color: #d8e4dc; }
  .seat.win .av { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(255,211,106,.5); }
  .seat.win .nm { background: var(--glow); color: #3a2a00; }
  .act { font: 600 .66rem var(--mono); padding: 2px 7px; border-radius: 3px; white-space: nowrap; background: rgba(0,0,0,.5); color: #e8eee9; }
  .act.bet { background: var(--accent); color: var(--accent-ink); }
  .act.you { background: #fff; color: #1b221e; }
  .hero { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
  .hero .cards { display: flex; gap: 5px; }
  .hero .line { display: flex; gap: 6px; align-items: center; }

  /* Progression bar */
  .prog { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .steps { display: flex; align-items: center; gap: 0; min-width: 0; overflow: hidden; }
  .steps button { border: 0; background: none; padding: 4px 6px; display: grid; justify-items: center; gap: 4px; font: 600 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 64px; }
  .steps button i { display: block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }
  .steps button.done i { background: var(--fg); border-color: var(--fg); }
  .steps button.on { color: var(--fg); } .steps button.on i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,103,79,.3); }
  .steps .seg { flex: 1; height: 2px; background: var(--line); min-width: 10px; }
  .steps .seg.done { background: var(--fg); }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ctl .hint { font-size: .78rem; color: var(--muted); margin-right: 4px; }
  .ctl button.ghost { background: transparent; }
  .ctl button[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Card picker */
  .picker { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: grid; gap: 10px; max-height: calc(100vh - 160px); overflow: auto; }
  .picker[hidden] { display: none; }
  .pk-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .82rem; }
  .pk-head .x { margin-left: auto; padding: 4px 9px; font-size: 1rem; line-height: 1; }
  .slots { display: flex; gap: 6px; align-items: center; }
  .slots .lbl { font: 600 .66rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .slot-s { width: 34px; height: 46px; border-radius: 5px; border: 2px dashed var(--line); display: grid; place-items: center; cursor: pointer; background: var(--bg); }
  .slot-s.filled { border-style: solid; }
  .slot-s.next { border-color: var(--accent); }
  .slot-s .card { width: 100%; height: 100%; box-shadow: none; }
  .slots .gap { width: 10px; }
  .deck { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; max-width: 560px; }
  .deck button { padding: 0; height: 30px; font: 600 .74rem var(--mono); border-radius: 4px; background: var(--card-face); color: var(--card-black); border: 1px solid var(--line); display: grid; place-items: center; }
  .deck button.red { color: var(--card-red); }
  .deck button.used { opacity: .25; cursor: default; }
  .deck button.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pk-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .say { display: flex; gap: 6px; align-items: center; }
  .say input { flex: 1; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .say #micBtn { font-size: 1rem; padding: 5px 9px; } .say #micBtn.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sayNote.err { color: var(--bad); }
  .meter { width: 46px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; flex: none; }
  .meter[hidden] { display: none; }
  .meter i { display: block; height: 100%; width: calc(var(--lvl, 0) * 100%); background: var(--good); transition: width .06s linear; }
  .ask { flex: 1 1 420px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0; min-width: 0; }
  .ask[hidden] { display: none; }
  .ask input { flex: 1 1 200px; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .ask #askMic { font-size: 1rem; padding: 5px 9px; } .ask #askMic.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ask.busy input { opacity: .6; }
  .ask .sayNote { flex: 1 1 100%; margin: 0; }
  .note.err { color: var(--bad); }
  .calc { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .seat.folded { opacity: .45; }
  .seat .av { font-size: .7rem; letter-spacing: .02em; }
  .rg { font: 500 .6rem var(--mono); color: #f3e3b3; background: rgba(0,0,0,.35); padding: 0 6px; border-radius: 8px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.known { box-shadow: 0 0 0 2px #f3e3b3, 0 2px 4px rgba(0,0,0,.4); }
  .act.fold { background: rgba(0,0,0,.3); color: #b9c3bd; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chg { font: 500 .7rem var(--body); padding: 2px 7px; border-radius: 10px; background: var(--track); color: var(--fg); }
  .reply { font-size: .88rem; }
  .msg { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; font-size: .86rem; }
  .msg p { margin: 0; }
  .msg.user { background: color-mix(in srgb, var(--accent) 14%, transparent); justify-self: end; max-width: 90%; }
  .msg.assistant { border: 1px solid var(--line); }
  .sugg { display: grid; gap: 6px; }
  .sugg button { text-align: left; font-size: .8rem; line-height: 1.35; }
  ul.opps { font-size: .8rem; }
  .advice .adv-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .advice .adv-act { font: 700 1.9rem var(--display); letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
  .advice.bad .adv-act { color: var(--bad); } .advice.good .adv-act { color: var(--good); } .advice.mid .adv-act { color: var(--warn); }
  .advice .adv-size { font: 600 .95rem var(--mono); }
  .gauge { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 22px; border-radius: 6px; overflow: visible; margin: 4px 0 2px; }
  .gauge span { display: grid; place-items: center; font: 600 .62rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  .gauge span:nth-child(1) { background: color-mix(in srgb, var(--bad) 75%, transparent); border-radius: 6px 0 0 6px; }
  .gauge span:nth-child(2) { background: color-mix(in srgb, var(--warn) 75%, transparent); }
  .gauge span:nth-child(3) { background: color-mix(in srgb, var(--good) 75%, transparent); border-radius: 0 6px 6px 0; }
  .gauge i { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); transition: left .25s ease; }
  .adv-why { font-size: .8rem; }

  /* Chips in front of the players */
  .bets { position: absolute; inset: 0; pointer-events: none; }
  .chipbet { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 12px; background: rgba(0,0,0,.42); color: #fff; font: 600 .76rem var(--mono); white-space: nowrap; transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), opacity .38s; z-index: 2; }
  .chipbet.sweep { opacity: 0; transition-duration: .42s; }
  .chipbet.bump { animation: bump .32s ease-out; }
  @keyframes bump { 40% { transform: translate(-50%, -50%) scale(1.18); } }
  .chips-stack { position: relative; width: 16px; height: 18px; }
  .chips-stack i { position: absolute; left: 0; bottom: calc(var(--k) * 3px); width: 16px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #f6d06b 0 30%, #d9a33a 31% 60%, #fff 61% 66%, #c98b20 67%); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
  .chips-stack i:nth-child(2) { filter: hue-rotate(-40deg) saturate(1.3); } .chips-stack i:nth-child(3) { filter: hue-rotate(160deg); } .chips-stack i:nth-child(4) { filter: grayscale(1) brightness(1.4); }
  .pot small { font: 500 .72rem var(--mono); opacity: .75; }
  /* Whose turn */
  .seat.turn .av { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(255,211,106,.55), 0 0 18px 4px rgba(255,211,106,.45); animation: turnpulse 1.4s ease-in-out infinite; }
  .seat.turn .nm { background: var(--glow); color: #3a2a00; }
  @keyframes turnpulse { 50% { box-shadow: 0 0 0 5px rgba(255,211,106,.25), 0 0 26px 8px rgba(255,211,106,.25); } }
  .hero.turn .cards { filter: drop-shadow(0 0 12px rgba(255,211,106,.65)); }
  .hero.turn .act.you { background: var(--glow); color: #3a2a00; }
  .act.toact { background: var(--glow); color: #3a2a00; }
  .act.blind { background: rgba(0,0,0,.35); color: #d8e4dc; }
  .act.empty { visibility: hidden; }
  .card.dim { opacity: .4; }
  /* Action bar */
  .actbar { position: absolute; z-index: 5; transform: translate(-50%, 0); display: grid; gap: 5px; padding: 7px 8px 8px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(0,0,0,.35); min-width: 230px; }
  .actbar[hidden] { display: none; }
  .actbar[data-side="below"] { margin-top: 84px; }
  .actbar[data-side="above"] { transform: translate(-50%, -100%); margin-top: -84px; }
  .actbar[data-side="hero"] { top: auto; bottom: 2%; transform: none; margin-left: 150px; }
  .actbar[data-side="left"] { transform: translate(-100%, -50%); margin-left: -64px; }
  .actbar[data-side="right"] { transform: translate(0, -50%); margin-left: 64px; }
  .actbar.you { border-color: var(--glow); box-shadow: 0 0 0 2px rgba(255,211,106,.35), 0 10px 28px rgba(0,0,0,.35); }
  .ab-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ab-tip { color: var(--warn); }
  .ab-auto { border: 0; background: none; padding: 0 2px; font: 600 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .ab-row { display: flex; gap: 5px; }
  .ab { flex: 1; display: grid; justify-items: center; gap: 1px; padding: 5px 8px; border-radius: 7px; font: 600 .78rem var(--body); line-height: 1.1; white-space: nowrap; transition: transform .1s, background .15s; }
  .ab b { font: 600 .7rem var(--mono); opacity: .85; }
  .ab:hover { transform: translateY(-1px); }
  .ab.ab-fold { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: transparent; }
  .ab.ab-call { background: var(--panel); }
  .ab.ab-small { background: color-mix(in srgb, var(--good) 22%, var(--panel)); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
  .ab.ab-big { background: var(--good); border-color: var(--good); color: #fff; }
  .ab.rec { outline: 2px solid var(--glow); outline-offset: 1px; }
  .ab.rec span::before { content: "★ "; color: var(--warn); }
  .actbar.docked { position: static; transform: none; margin: 0; grid-column: 1 / -1; min-width: 0; box-shadow: none; }

  /* Editing on the table */
  .editable { cursor: pointer; }
  .card.editable:hover, .slot.editable:hover { outline: 2px solid rgba(255,255,255,.55); outline-offset: 2px; }
  .slot.editable { display: grid; place-items: center; transition: background .15s; }
  .slot.editable::after { content: "+"; color: rgba(255,255,255,.4); font: 600 1.3rem var(--body); }
  .slot.editable:hover { background: rgba(255,255,255,.08); }
  .editing { outline: 3px solid var(--glow) !important; outline-offset: 2px; }
  .card.pending { opacity: .8; box-shadow: 0 0 0 2px var(--glow); }
  .seat .av, .seat .nm { cursor: pointer; }
  body.is-editing .actbar:not(.docked) { visibility: hidden; }
  .seat .av:hover { border-color: #fff; }
  .cardpick { position: fixed; z-index: 40; width: 300px; padding: 9px 10px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 36px rgba(0,0,0,.4); display: grid; gap: 7px; }
  .cardpick[hidden] { display: none; }
  .cardpick.sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: auto; border-radius: 14px 14px 0 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .cp-head { display: flex; justify-content: space-between; align-items: center; font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cp-x { border: 0; background: none; padding: 0 4px; font-size: 1.1rem; line-height: 1; color: var(--muted); }
  .cp-ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cp-ranks button, .cp-suits button { padding: 7px 0; font: 600 .95rem var(--mono); border-radius: 6px; background: var(--card-face); color: var(--card-black); border-color: var(--line); }
  .cp-ranks button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cp-suits { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 4px; }
  .cp-suits button { font-size: 1.25rem; }
  .cp-suits button.red { color: var(--card-red); }
  .cp-suits .cp-rand { font: 500 .78rem var(--body); padding: 0 10px; background: var(--panel); color: var(--fg); }
  .cardpick button:disabled { opacity: .25; }
  .cp-hint { margin: 0; font-size: .72rem; color: var(--muted); }

    const groups = r.groups.map(g => {
      const share = g.n / r.n * 100, open = readOpen.has(g.key), shown = open ? g.combos : g.combos.slice(0, LIM);
      return `<div class="rg-grp"><div class="rg-head"><b>${esc(g.name)} <span class="note">${g.combos.length} combo${g.combos.length > 1 ? 's' : ''}</span></b><span class="v">${share < 1 ? '&lt;1' : Math.round(share)}%</span><div class="rg-bar"><i style="width:${Math.max(1, share)}%"></i></div></div>
        <div class="rcs">${shown.map(comboEl).join('')}${g.combos.length > LIM ? `<button class="more" data-rg="${esc(g.key)}">${open ? 'Fewer' : `+${g.combos.length - LIM} more`}</button>` : ''}</div></div>`;
    }).join('');
    html += blk(`Their likely hands <small>${board().length >= 3 ? 'by what they make on this board' : 'by type'}</small>`, `${groups || '<p class="note">No hands left that fit.</p>'}<div class="rd-legend"><span>Each chip is one exact hand.</span><span><span class="rc"><span>A♠</span></span> likely</span><span><span class="rc mid"><span>A♠</span></span> less likely</span><span><span class="rc lo"><span>A♠</span></span> unlikely</span></div>`);
    html += `<p class="note">A rule-of-thumb read, not a solver. To use your own read instead, click the player and pick a style or type a range.</p>`;
    return html;
  }
  function setTab(t) { tab = t; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === t ? 'true' : 'false')); renderPane(); }
  $('pane').addEventListener('click', e => {
    const sp = e.target.closest('[data-speak]'); if (sp) { speakHand(sp); return; }
    const tg = e.target.closest('[data-tab-go]'); if (tg) { setTab(tg.dataset.tabGo); return; }
    const rg = e.target.closest('[data-rg]'); if (rg) { readOpen.has(rg.dataset.rg) ? readOpen.delete(rg.dataset.rg) : readOpen.add(rg.dataset.rg); renderPane(); return; }
    const sr = e.target.closest('[data-read]'); if (sr) { showRead(+sr.dataset.read); return; }
    const sg = e.target.closest('[data-suggest]'); if (sg) { $('askIn').value = sg.dataset.suggest; askAgent(sg.dataset.suggest); return; }
    if (e.target.closest('[data-clear-coach]')) { coachLog = []; lastReply = null; store.set('walkthrough.coach', []); renderPane(); return; }
    const b = e.target.closest('[data-more]'); if (!b) return; const box = $(b.dataset.more); const open = b.dataset.open === '1'; box.querySelectorAll('.row.hid, .row.was-hid').forEach(r => { r.classList.toggle('hid', open); r.classList.add('was-hid'); }); b.dataset.open = open ? '0' : '1'; b.textContent = open ? `Show ${b.dataset.n} more` : 'Show fewer';
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-close-read]')) { closeRead(); return; } setTab(b.dataset.tab); }));
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('nextBtn').click(); } if (e.key === 'ArrowLeft') go(step - 1); if (e.key.toLowerCase() === 'n') newHand(); if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

  // Server features light up once /api/status answers (nothing changes when the page is opened from disk).
  if (HV) HV.api.init().then(() => {
    $('askMic').hidden = !(canLive() || (HV.api.has('transcribe') && HV.recordingSupported()));
    if (HV.api.has('agent')) $('coachTab').hidden = false;
    if (hand) renderPane();
  });

  // Start from the last scenario on this device, or a fresh table.
  const saved = store.get('walkthrough.scenario');
  coachLog = store.get('walkthrough.coach') || [];
  const lastA = [...coachLog].reverse().find(x => x.role === 'assistant'); if (lastA) lastReply = { text: lastA.text, changes: lastA.changes || [] };
  if (saved && saved.scenario) loadScenario(saved.scenario, { prev: saved.hand || null });
  else loadScenario(SC.create({ opponents: +$('nOpp').value }), { prev: null });
})();
</script>
