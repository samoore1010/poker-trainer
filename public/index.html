<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Walkthrough Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one-screen poker client. Stadium-shaped table in a wood rail on the left (players around the rail with name plates and action bubbles, chips in front of them, pot + board in the middle, you at the bottom centre with your cards beside you, the made hand glowing); the action buttons and the progression bar beneath it; a tabbed advisor panel of numbers and small charts on the right. Stacks on phones. */
  :root {
    --bg: #d9ded8; --room: #c3cac2; --panel: #f6f7f4; --fg: #1b221e; --muted: #5d6862; --line: #c4ccc5; --track: #dfe4de;
    --felt: #2d6a4d; --felt-dark: #1d4a35; --rail: #4a2e1f; --rail-hi: #6b4530;
    --accent: #e0674f; --accent-ink: #1a0d0a; --good: #2f7d4f; --warn: #b27a12; --bad: #b8402e; --glow: #ffd36a;
    --t1: #2f7d4f; --t2: #6aa36f; --t3: #b8c98f; --t4: #d9d6b0; --t5: #e9e8e0;
    --card-face: #fdfdfb; --card-red: #c1302a; --card-black: #17201b; --card-blue: #1f5fcf; --card-green: #1d8a3c;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
      --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
      --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
      --card-face: #f4f2ec; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1416; --room: #161d20; --panel: #1a2328; --fg: #e6ebe7; --muted: #93a099; --line: #2b383d; --track: #253136;
    --felt: #2a5f45; --felt-dark: #1a3d2c; --rail: #3b2418; --rail-hi: #5a3826;
    --good: #5fc38a; --warn: #e0b04a; --bad: #e0674f; --t1: #4fa874; --t2: #3f7f5a; --t3: #395f4a; --t4: #2f4a3f; --t5: #253136;
    --card-face: #f4f2ec; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: .02em; margin-right: auto; }
  .opts { display: flex; gap: 12px; align-items: center; font-size: .82rem; flex-wrap: wrap; }
  .opts label { display: inline-flex; gap: 5px; align-items: center; }
  select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
  button { font: 500 .88rem var(--body); padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .room { background: radial-gradient(ellipse 90% 55% at 50% 0%, #5c3f28 0%, #2b1d13 55%, #150e09 100%); display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 14px 16px 10px; gap: 10px; }
  .tablewrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 46px 60px 26px; }
  /* The table: a stadium of felt inside a dark wood rail with a thin gold trim. Felt colour: body.felt-green / felt-blue. */
  .table { --felt: #b4895b; --felt-dark: #7d5636; position: relative; width: min(100%, calc((100vh - 290px) * 1.9)); aspect-ratio: 1.9; border-radius: 999px; border: 16px solid transparent;
    background: radial-gradient(ellipse at 50% 42%, var(--felt) 0%, var(--felt-dark) 100%) padding-box, linear-gradient(160deg, #6e4b2f, #3b2416 35%, #24150c 65%, #5c3b23) border-box;
    box-shadow: 0 0 0 2px #140b06, 0 0 0 3px rgba(222,184,128,.3), 0 26px 60px rgba(0,0,0,.65), inset 0 0 0 2px rgba(222,184,128,.6), inset 0 0 80px rgba(0,0,0,.45); }
  body.felt-green .table { --felt: #2f7352; --felt-dark: #1b4a34; }
  body.felt-blue .table { --felt: #2f6694; --felt-dark: #1a3d5e; }
  .table::before { content: ""; position: absolute; inset: 8% 6%; border: 2px solid rgba(255,238,205,.16); border-radius: 999px; pointer-events: none; }
  .center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); display: grid; gap: 10px; justify-items: center; }
  .board { display: flex; gap: 5px; }
  .pot { display: grid; justify-items: center; color: #fff; background: rgba(45,28,16,.55); border: 1px solid rgba(255,235,200,.1); padding: 3px 22px 4px; border-radius: 16px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .pot .lbl { font: 500 .72rem var(--body); color: #f3e7d4; }
  .pot .amt { font: 600 1.3rem var(--mono); color: #f4c64f; }
  .pot.win { background: color-mix(in srgb, var(--good) 80%, transparent); } .pot.win .amt { color: #fff; }
  .card { width: 44px; height: 62px; border-radius: 6px; background: var(--card-face); color: var(--card-black); display: grid; grid-template-rows: auto 1fr; padding: 4px 5px; font-family: var(--mono); font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,.45); position: relative; }
  .card .r { font-size: 1rem; line-height: 1; } .card .s { font-size: 1.35rem; line-height: 1; align-self: end; justify-self: end; }
  .card.red { color: var(--card-red); }
  body.four .card.su-d { color: var(--card-blue); } body.four .card.su-c { color: var(--card-green); }
  .card.sm { width: 30px; height: 42px; padding: 2px 3px; border-radius: 4px; } .card.sm .r { font-size: .7rem; } .card.sm .s { font-size: .9rem; }
  .card.lg { width: 60px; height: 84px; border-radius: 7px; } .card.lg .r { font-size: 1.35rem; } .card.lg .s { font-size: 1.8rem; }
  .card.back { background: radial-gradient(circle at 50% 50%, rgba(160,180,230,.35) 0 18%, transparent 19%), repeating-linear-gradient(45deg, #26314b 0 4px, #1b2338 4px 8px); border: 2px solid #cfd7ea; }
  .card.glow { box-shadow: 0 0 0 2px var(--glow), 0 0 16px 5px rgba(255,211,106,.55); }
  .card.dim { opacity: .55; }
  .slot { width: 44px; height: 62px; border-radius: 6px; border: 2px dashed rgba(255,245,225,.32); }
  /* A player: speech bubble with the last action, avatar (position) with the cards tucked beside it, name plate with the stack. */
  .seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; width: 124px; z-index: 2; }
  .pic { position: relative; display: grid; place-items: center; }
  .seat .cards { position: absolute; right: calc(100% - 14px); top: 10px; display: flex; z-index: 0; }
  .seat .cards.r { right: auto; left: calc(100% - 14px); }
  .seat .cards .card { margin-left: -12px; } .seat .cards .card:first-child { margin-left: 0; transform: rotate(-7deg); } .seat .cards .card + .card { transform: rotate(6deg) translateY(1px); }
  .av { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 50% 32%, #75604d, #2f241b 75%); border: 2px solid rgba(255,232,196,.6); display: grid; place-items: center; font: 700 .95rem var(--display); letter-spacing: .02em; color: #f8ecd8; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .plate { position: relative; z-index: 2; margin-top: -7px; min-width: 100px; max-width: 124px; border-radius: 6px; background: linear-gradient(#1f2638, #0e121c); border: 1.5px solid #4a5677; box-shadow: 0 4px 10px rgba(0,0,0,.5); text-align: center; overflow: hidden; }
  .plate .nm { display: block; background: none; border-radius: 0; max-width: none; padding: 2px 8px 1px; font: 600 .82rem var(--body); color: #fff; border-bottom: 1px solid rgba(255,255,255,.12); }
  .plate .st { display: block; padding: 1px 8px 2px; font: 600 .9rem var(--mono); color: #f4c64f; }
  .nm { font: 600 .72rem var(--body); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { font: 500 .7rem var(--mono); color: #d8e4dc; }
  .tbar { display: none; width: 78%; height: 4px; margin-top: 3px; border-radius: 2px; background: linear-gradient(90deg, #2f6fe0, #6aa4ff, #2f6fe0); background-size: 200% 100%; animation: tbar 1.6s linear infinite; }
  @keyframes tbar { to { background-position: -200% 0; } }
  .seat.win .av, .hero.win .av { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(255,211,106,.5), 0 4px 10px rgba(0,0,0,.5); }
  .seat.win .plate, .hero.win .plate { border-color: var(--glow); }
  .act { font: 600 .66rem var(--mono); padding: 2px 7px; border-radius: 3px; white-space: nowrap; background: rgba(0,0,0,.5); color: #e8eee9; }
  /* the speech bubble */
  .seat .act, .hero .act { --bub: #5a544d; position: relative; z-index: 3; margin-bottom: -6px; padding: 3px 11px; border-radius: 8px; background: var(--bub); color: #fff; font: 600 .8rem var(--body); box-shadow: 0 2px 6px rgba(0,0,0,.45); max-width: 160px; overflow: visible; text-overflow: ellipsis; }
  .seat .act::after, .hero .act::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--bub); }
  .seat .act.bet, .hero .act.bet { --bub: #d8953a; }
  .seat .act.fold, .hero .act.fold { --bub: #4a4642; color: #e4ded6; }
  .seat .act.toact, .hero .act.toact, .hero.turn .act.you { --bub: var(--glow); color: #3a2a00; }
  .hero .act.you { --bub: #f3eee4; color: #1b221e; }
  .hero { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; z-index: 3; }
  .hero .cards { position: absolute; left: calc(100% + 2px); bottom: 2px; display: flex; gap: 4px; }
  .hero .plate { min-width: 112px; }

  /* Progression bar */
  /* Bottom panel: the camera on the left, the actions and hand controls on the right (stacked on phones, actions first) */
  .prog { position: relative; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .camdock { padding: 10px 14px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 6px; min-width: 0; }
  .playdock { padding: 10px 14px; display: grid; align-content: center; gap: 10px; min-width: 0; }
  .cam-off { display: grid; gap: 6px; align-content: center; height: 100%; }
  .cam-off[hidden], .cam-on[hidden] { display: none; }
  .cam-start { justify-self: start; font-weight: 600; }
  .cam-off .note, .dock-info { margin: 0; font-size: .76rem; }
  .dock-info:empty { display: none; }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ctl .hint { font-size: .78rem; color: var(--muted); margin-right: auto; }
  .ctl button.ghost { background: transparent; }
  .ctl .reset { font-size: .76rem; padding: 5px 9px; color: var(--muted); border-style: dashed; }
  .ctl .reset.armed { color: #fff; background: var(--bad); border-color: var(--bad); border-style: solid; }
  .ctl button[aria-expanded="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Card picker */
  .picker { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: grid; gap: 10px; max-height: calc(100vh - 160px); overflow: auto; }
  .picker[hidden] { display: none; }
  .pk-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .82rem; }
  .pk-head .x { margin-left: auto; padding: 4px 9px; font-size: 1rem; line-height: 1; }
  .slots { display: flex; gap: 6px; align-items: center; }
  .slots .lbl { font: 600 .66rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .slot-s { width: 34px; height: 46px; border-radius: 5px; border: 2px dashed var(--line); display: grid; place-items: center; cursor: pointer; background: var(--bg); }
  .slot-s.filled { border-style: solid; }
  .slot-s.next { border-color: var(--accent); }
  .slot-s .card { width: 100%; height: 100%; box-shadow: none; }
  .slots .gap { width: 10px; }
  .deck { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; max-width: 560px; }
  .deck button { padding: 0; height: 30px; font: 600 .74rem var(--mono); border-radius: 4px; background: var(--card-face); color: var(--card-black); border: 1px solid var(--line); display: grid; place-items: center; }
  .deck button.red { color: var(--card-red); }
  .deck button.used { opacity: .25; cursor: default; }
  .deck button.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pk-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .say { display: flex; gap: 6px; align-items: center; }
  .say input { flex: 1; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .say #micBtn { font-size: 1rem; padding: 5px 9px; } .say #micBtn.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sayNote.err { color: var(--bad); }
  .meter { width: 46px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; flex: none; }
  .meter[hidden] { display: none; }
  .meter i { display: block; height: 100%; width: calc(var(--lvl, 0) * 100%); background: var(--good); transition: width .06s linear; }
  .ask { flex: 1 1 420px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0; min-width: 0; }
  .ask[hidden] { display: none; }
  .ask input { flex: 1 1 200px; min-width: 0; font: 400 .88rem var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .ask #askMic { font-size: 1rem; padding: 5px 9px; } .ask #askMic.live { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ask.busy input { opacity: .6; }
  .ask .sayNote { flex: 1 1 100%; margin: 0; }
  .note.err { color: var(--bad); }
  .calc { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .seat.folded .pic, .seat.folded .plate, .hero.folded .pic, .hero.folded .plate { opacity: .5; }
  .rg { margin-top: 3px; font: 500 .62rem var(--mono); color: #f3e3b3; background: rgba(20,12,6,.55); padding: 0 7px; border-radius: 8px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.known { box-shadow: 0 0 0 2px #f3e3b3, 0 2px 4px rgba(0,0,0,.4); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chg { font: 500 .7rem var(--body); padding: 2px 7px; border-radius: 10px; background: var(--track); color: var(--fg); }
  .reply { font-size: .88rem; }
  .msg { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; font-size: .86rem; }
  .msg p { margin: 0; }
  .msg.user { background: color-mix(in srgb, var(--accent) 14%, transparent); justify-self: end; max-width: 90%; }
  .msg.assistant { border: 1px solid var(--line); }
  .sugg { display: grid; gap: 6px; }
  .sugg button { text-align: left; font-size: .8rem; line-height: 1.35; }
  ul.opps { font-size: .8rem; }
  .advice .adv-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .advice .adv-act { font: 700 1.9rem var(--display); letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
  .advice.bad .adv-act { color: var(--bad); } .advice.good .adv-act { color: var(--good); } .advice.mid .adv-act { color: var(--warn); }
  .advice .adv-size { font: 600 .95rem var(--mono); }
  .gauge { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 22px; border-radius: 6px; overflow: visible; margin: 4px 0 2px; }
  .gauge span { display: grid; place-items: center; font: 600 .62rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  .gauge span:nth-child(1) { background: color-mix(in srgb, var(--bad) 75%, transparent); border-radius: 6px 0 0 6px; }
  .gauge span:nth-child(2) { background: color-mix(in srgb, var(--warn) 75%, transparent); }
  .gauge span:nth-child(3) { background: color-mix(in srgb, var(--good) 75%, transparent); border-radius: 0 6px 6px 0; }
  .gauge i { position: absolute; top: -5px; bottom: -5px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); transition: left .25s ease; }
  .adv-why { font-size: .8rem; }
  .evl { display: grid; gap: 3px; }
  .evr { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: .8rem; }
  .evr.best { font-weight: 600; }
  .evb { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .evb i { display: block; height: 100%; background: var(--good); } .evb i.neg { background: var(--bad); }
  .evv { font: 600 .8rem var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .adv-hand { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 2px; padding: 9px 12px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .adv-hand .hn { display: grid; gap: 1px; min-width: 0; }
  .adv-hand .hn b { font: 600 1.15rem var(--body); }
  .adv-hand .pc { font: 600 2.1rem var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
  .blk.wait button { justify-self: start; }

  /* Chips in front of the players */
  .bets { position: absolute; inset: 0; pointer-events: none; }
  .chipbet { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; color: #fff; font: 600 .86rem var(--mono); white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.75); transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), opacity .38s; z-index: 2; }
  .chipbet.sweep { opacity: 0; transition-duration: .42s; }
  .chipbet.bump { animation: bump .32s ease-out; }
  @keyframes bump { 40% { transform: translate(-50%, -50%) scale(1.18); } }
  .chips-stack { position: relative; width: 26px; height: calc(12px + var(--n) * 3px); }
  .chips-stack i { --c: #8d8f94; position: absolute; left: 0; bottom: calc(var(--k) * 3px); width: 26px; height: 12px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, var(--c) 0 34%, #f4f4f2 36% 44%, transparent 46%), repeating-conic-gradient(var(--c) 0 22.5deg, #f4f4f2 22.5deg 45deg); box-shadow: 0 1px 0 #1d1d1d, 0 2px 3px rgba(0,0,0,.4); }
  .chips-stack i:nth-child(2) { --c: #c0392b; } .chips-stack i:nth-child(3) { --c: #2d62c8; } .chips-stack i:nth-child(4) { --c: #26282c; }
  /* Whose turn: a glowing avatar and a moving bar under the name plate */
  .seat.turn .av, .hero.turn .av { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(255,211,106,.55), 0 0 18px 4px rgba(255,211,106,.45); animation: turnpulse 1.4s ease-in-out infinite; }
  .seat.turn .plate, .hero.turn .plate { border-color: #6aa4ff; }
  .seat.turn .tbar, .hero.turn .tbar { display: block; }
  @keyframes turnpulse { 50% { box-shadow: 0 0 0 5px rgba(255,211,106,.25), 0 0 26px 8px rgba(255,211,106,.25); } }
  .hero.turn .cards { filter: drop-shadow(0 0 10px rgba(255,211,106,.55)); }
  .act.empty { visibility: hidden; }
  .card.dim { opacity: .4; }
  /* Action bar, under the table: Fold · Check/Call · Bet/Raise (which opens the sizing: presets, a slider, Confirm) */
  .actbar { display: grid; gap: 8px; }
  .actbar[hidden] { display: none; }
  .ab-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 .7rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .actbar.you .ab-head > span:first-child { color: var(--fg); }
  .ab-tip { color: var(--warn); }
  .ab-auto { border: 0; background: none; padding: 0 2px; font: 600 .7rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

  /* Advisor */

    const rg = e.target.closest('[data-rg]'); if (rg) { readOpen.has(rg.dataset.rg) ? readOpen.delete(rg.dataset.rg) : readOpen.add(rg.dataset.rg); renderPane(); return; }
    const sr = e.target.closest('[data-read]'); if (sr) { showRead(+sr.dataset.read); return; }
    const sg = e.target.closest('[data-suggest]'); if (sg) { $('askIn').value = sg.dataset.suggest; askAgent(sg.dataset.suggest); return; }
    if (e.target.closest('[data-clear-coach]')) { coachLog = []; lastReply = null; store.set('walkthrough.coach', []); renderPane(); return; }
    const b = e.target.closest('[data-more]'); if (!b) return; const box = $(b.dataset.more); const open = b.dataset.open === '1'; box.querySelectorAll('.row.hid, .row.was-hid').forEach(r => { r.classList.toggle('hid', open); r.classList.add('was-hid'); }); b.dataset.open = open ? '0' : '1'; b.textContent = open ? `Show ${b.dataset.n} more` : 'Show fewer';
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-close-read]')) { closeRead(); return; } setTab(b.dataset.tab); }));
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('nextBtn').click(); } if (e.key === 'ArrowLeft') go(step - 1); if (e.key.toLowerCase() === 'n') nextHand(); if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

  // Server features light up once /api/status answers (nothing changes when the page is opened from disk).
  if (HV) HV.api.init().then(() => {
    $('askMic').hidden = !(canLive() || (HV.api.has('transcribe') && HV.recordingSupported()));
    if (HV.api.has('agent')) $('coachTab').hidden = false;
    if (hand) renderPane();
  });

  // Start from the last scenario on this device, or a fresh table.
  const saved = store.get('walkthrough.scenario');
  coachLog = store.get('walkthrough.coach') || [];
  const lastA = [...coachLog].reverse().find(x => x.role === 'assistant'); if (lastA) lastReply = { text: lastA.text, changes: lastA.changes || [] };
  if (saved && saved.scenario) loadScenario(saved.scenario, { prev: saved.hand || null });
  else loadScenario(SC.create({ opponents: +$('nOpp').value }), { prev: null });
})();
</script>
